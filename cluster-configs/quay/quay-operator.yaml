---
apiVersion: v1
kind: Namespace
metadata:
  name: quay-registry
  labels:
    name: quay-registry
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: quay-registry-og
  namespace: quay-registry
spec:
  upgradeStrategy: Default
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: quay-operator
  namespace: quay-registry
spec:
  channel: stable-3.13
  installPlanApproval: Automatic
  name: quay-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
