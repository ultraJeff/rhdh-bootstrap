apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: argocd-applications

# Sync wave ordering:
#   Wave 1: keycloak, pipelines, quay (independent operators)
#   Wave 2: dev-spaces, orchestrator (depend on operators)
#   Wave 3: developer-hub (depends on keycloak + operators)
#   Wave 4: workflows (depends on orchestrator CRDs)

resources:
  - keycloak.yaml
  - pipelines.yaml
  - quay.yaml
  - dev-spaces.yaml
  - orchestrator.yaml
  - developer-hub.yaml
  - workflows.yaml
