---
# ArgoCD Application for Orchestrator Workflows (SonataFlow)
#
# Deploys after orchestrator operators are ready (wave 4).
# Uses SkipDryRunOnMissingResource because SonataFlow CRDs
# are installed by the orchestrator operator (wave 2).
#
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workflows
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/ultraJeff/rhdh-bootstrap.git
    targetRevision: main
    path: workflows
  destination:
    server: https://kubernetes.default.svc
    namespace: sonataflow-infra
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
